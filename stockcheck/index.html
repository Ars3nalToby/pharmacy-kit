  /* ================= Files ================= */

  async function offerFile(filename, text) {
    if (caps.downloads) {
      try { await caps.downloads.save({ filename, data: text }); toast('Saved ' + filename); return; }
      catch (e) { if (e && e.code === 'declined') return; }
    }
    // Standalone (Vercel / home-screen app): use the iPhone share sheet, else a normal download
    try {
      const type = /\.csv$/i.test(filename) ? 'text/csv' : (/\.json$/i.test(filename) ? 'application/json' : 'text/plain');
      const file = new File([text], filename, { type });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        toast('Shared ' + filename); return;
      }
      const url = URL.createObjectURL(file);
      const a = document.createElement('a'); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast('Downloaded ' + filename); return;
    } catch (e) { if (e && e.name === 'AbortError') return; }
    ui.fileFallback = { filename, text };
    showFallback();
  }
  function showFallback() {
    const f = ui.fileFallback; if (!f) return;
    let box = $('#fallback');
    if (!box) { box = document.createElement('section'); box.id = 'fallback'; box.className = 'panel'; $('#view').prepend(box); }
    box.innerHTML = '<div class="panel-head"><h3>' + esc(f.filename) + '</h3><button class="btn small" data-act="closeFallback">Close</button></div><p class="muted small">Downloads are not available in this view. Copy the text and paste it into a file or spreadsheet.</p><textarea id="fallbackText" readonly>' + esc(f.text) + '</textarea><div class="btns"><button class="btn primary small" data-act="copyFallback">Copy</button></div>';
  }

  /* ================= Toast & sound ================= */

  let toastTimer = null;
  function toast(msg, undo) {
    let t = $('#toast');
    if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
    t.innerHTML = '<span>' + esc(msg) + '</span>' + (undo ? '<button type="button" id="toastUndo">Undo</button>' : '');
    t.hidden = false;
    if (undo) $('#toastUndo').onclick = () => { undo(); t.hidden = true; };
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, undo ? 5000 : 3200);
  }
  let audio = null;
  function beep(ok) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = ok ? 1250 : 330; o.type = ok ? 'sine' : 'square';
      g.gain.setValueAtTime(0.06, audio.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + (ok ? 0.09 : 0.25));
      o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + 0.3);
    } catch (e) { /* optional */ }
    try { if (!ok && navigator.vibrate) navigator.vibrate([60, 40, 60]); } catch (e) { /* ignore */ }
  }

  /* ================= Events ================= */

  function draftFor(pid) { const p = prod(pid); return { productId: pid, gtin: (p && p.gtin) || '', batch: '', expiry: '', serial: '', qty: 1, source: 'manual', warnings: [], duplicate: null, lineId: null }; }

  document.addEventListener('click', (e) => {
    if (e.target.id === 'photoCanvas') { zoomDecode(e); return; }
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act, id = b.dataset.id;
    switch (act) {
      case 'tab': setTab(b.dataset.tab); break;
      case 'method': ui.method = b.dataset.m; renderView(); setTimeout(() => { const i = $(ui.method === 'scanner' ? '#scanInput' : '#searchInput'); if (i) i.focus(); }, 30); break;
      case 'mode': state.settings.scanMode = b.dataset.m; save(); renderView(); break;
      case 'openCamera': ui.method = 'photo'; setTab('scan'); setTimeout(() => { const i = $('#photoInput'); if (i) i.click(); }, 60); break;
      case 'demoPhoto': demoPhoto(); break;
      case 'aiRead': aiRead(b.dataset.mode); break;
      case 'checkProduct': case 'pickProduct': {
        const p = prod(id); if (!p) break;
        ui.method = 'search'; ui.searchQuery = p.name; ui.current = draftFor(id);
        if (act === 'checkProduct') setTab('scan'); else renderView();
        setTimeout(() => { const f = $('#fBatch'); if (f) f.focus(); }, 60);
        break;
      }
      case 'addByName': {
        const pid = ensureProductByName(ui.searchQuery); save();
        ui.current = draftFor(pid); renderView();
        setTimeout(() => { const f = $('#fBatch'); if (f) f.focus(); }, 60);
        break;
      }
      case 'qty': { const q = $('#fQty'); if (q) { q.value = Math.max(0, (Number(q.value) || 0) + Number(b.dataset.d)); if (ui.current && ui.current.lineId) updateLineFromCard(); } break; }
      case 'commit': commit(false); break;
      case 'removeLine': removeLine(id); toast('Removed'); break;
      case 'editLine': {
        const l = state.round.lines.find((x) => x.id === id); if (!l) break;
        ui.current = { productId: l.productId, gtin: l.gtin, batch: l.batch, expiry: l.expiry, serial: l.serial, qty: l.qty, source: l.source, warnings: [], duplicate: null, lineId: l.id };
        if (tab !== 'scan') setTab('scan'); else renderCard();
        setTimeout(() => { const c = $('#card'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'center' }); const n = $('#fName'); if (n && !n.value) n.focus({ preventScroll: true }); }, 60);
        break;
      }
      case 'pull': setPulled(b.dataset.key, true); break;
      case 'unpull': setPulled(b.dataset.key, false); break;
      case 'togglePulled': ui.showPulled = !ui.showPulled; renderView(); break;
      case 'zoomThumb': ui.openThumb = ui.openThumb === b.dataset.key ? null : b.dataset.key; renderView(); break;
      case 'exportPacks': offerFile(csvName('packs'), packsCsv(state.round.lines)); break;
      case 'exportShort': offerFile(csvName('short-dated'), shortCsv()); break;
      case 'exportAttempts': offerFile(csvName('photo-log'), attemptsCsv()); break;
      case 'askFinish': ui.confirm = 'finish'; renderView(); break;
      case 'finishRound': finishRound(); break;
      case 'askReset': ui.confirm = 'reset'; renderView(); break;
      case 'reset':
        thumbs = {}; saveThumbs();
        state = emptyState(state.settings); reindex(); ui.confirm = null; ui.current = null; ui.photo = null;
        save(); setTab('today'); toast('All data deleted from this phone');
        break;
      case 'cancelConfirm': ui.confirm = null; renderView(); break;
      case 'ddCsv': offerFile(csvName('dd-check'), ddCsv()); break;
      case 'ddCopy': {
        const txt = ddText();
        try { navigator.clipboard.writeText(txt).then(() => toast('Summary copied'), () => { ui.fileFallback = { filename: 'dd-summary.txt', text: txt }; showFallback(); }); }
        catch (er) { ui.fileFallback = { filename: 'dd-summary.txt', text: txt }; showFallback(); }
        break;
      }
      case 'ddAskClear': ui.confirm = 'ddclear'; renderView(); setTimeout(() => { const d = $('#ddPanel'); if (d) d.scrollIntoView({ block: 'center' }); }, 30); break;
      case 'ddClear': state.dd = { startedAt: null, witness: '', rows: {} }; ui.confirm = null; save(); renderView(); toast('DD check cleared'); break;
      case 'backup': offerFile('stockcheck-backup-' + today() + '.json', JSON.stringify({ state, thumbs })); break;
      case 'closeFallback': { ui.fileFallback = null; const fb = $('#fallback'); if (fb) fb.remove(); break; }
      case 'copyFallback': {
        const ta = $('#fallbackText');
        try { navigator.clipboard.writeText(ta.value).then(() => toast('Copied'), () => { ta.select(); toast('Selected — press copy'); }); } catch (er) { ta.select(); toast('Selected — press copy'); }
        break;
      }
    }
  });

  document.addEventListener('submit', (e) => {
    if (e.target.id !== 'scanForm') return;
    e.preventDefault();
    const i = $('#scanInput'); const v = i.value; i.value = '';
    if (v.trim()) {
      const r = handleRaw(v, 'scan');
      logAttempt({ method: 'scanner', outcome: r ? 'read' : 'fail', kind: kindOf(r), hasBatch: !!(r && r.fields.batch), hasExpiry: !!(r && r.fields.expiry) });
    }
    i.focus();
  });

  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'searchInput') { ui.searchQuery = t.value; renderSearchResults(); }
    else if (t.id === 'recallInput') { ui.recall = t.value; renderRecall(); }
    else if (t.id === 'fQty' && ui.current && ui.current.lineId) updateLineFromCard();
  });

  document.addEventListener('change', async (e) => {
    const t = e.target;
    if ((t.id === 'photoInput' || t.id === 'galleryInput') && t.files && t.files[0]) {
      const f = t.files[0]; t.value = '';
      try { processPhoto(await fileToCanvas(f, 1600), 'photo'); } catch (er) { toast(er.message || 'Could not open that photo'); }
    } else if (t.id === 'restoreInput' && t.files && t.files[0]) {
      try {
        const data = JSON.parse(await t.files[0].text());
        const s = migrate(data.state || data);
        if (!s || s.v !== 2 || !Array.isArray(s.products)) throw new Error('bad');
        state = s; state.settings = Object.assign(defaultSettings(), s.settings || {});
        if (data.thumbs) { thumbs = data.thumbs; saveThumbs(); }
        reindex(); save(); rerender(); toast('Backup restored');
      } catch (er) { toast('That is not a StockCheck backup file.'); }
      t.value = '';
    } else if (t.id === 'fBatch' || t.id === 'fExpiry') {
      if (!ui.current) return;
      if (t.id === 'fExpiry' && t.value.trim() && !SC.parseLooseExpiry(t.value)) { toast('Expiry not recognised. Use MM/YYYY.'); return; }
      if (ui.current.lineId) updateLineFromCard(); else readCardFields();
      refreshCardBits();
    } else if (t.id === 'fName' && ui.current && ui.current.productId) {
      const p = prod(ui.current.productId); p.name = t.value.trim() || 'Unnamed product'; save();
      const h = $('#pnameText'); if (h) h.textContent = p.name;
      renderRound();
    } else if (t.id === 'locInput') { state.settings.lastLocation = t.value.trim(); save(); }
    else if (t.id === 'setWho') { state.settings.who = t.value.trim(); save(); renderHeader(); toast('Name saved'); }
    else if (t.id === 'setStore') { state.settings.store = t.value.trim(); save(); renderHeader(); toast('Store saved'); }
    else if (t.id === 'setSoon') { state.settings.soonDays = Number(t.value) || 90; save(); renderNav(); toast('Short-dated threshold saved'); }
    else if (t.dataset && t.dataset.ddf) {
      const pid = t.dataset.ddid, f = t.dataset.ddf;
      const r = state.dd.rows[pid] || (state.dd.rows[pid] = {});
      r[f] = f === 'note' ? t.value.trim() : (t.value === '' ? '' : Number(t.value));
      if (!state.dd.startedAt) state.dd.startedAt = new Date().toISOString();
      save();
      const st = $('#dd-st-' + CSS.escape(pid)); if (st) st.innerHTML = ddStatusHtml(r);
      if (f !== 'note') {
        const sm = ddSummary(), c = $('#ddChecked'), b = $('#ddBad');
        if (c) c.textContent = sm.checked.length + '/' + sm.rows.length;
        const stx = $('#ddStarted'); if (stx) stx.textContent = 'Started ' + fmtDate(state.dd.startedAt);
        if (b) { b.textContent = sm.bad.length; b.className = 'v num ' + (sm.bad.length ? 'bad' : sm.checked.length ? 'good' : ''); }
      }
    }
    else if (t.id === 'ddWitness') { state.dd.witness = t.value.trim(); save(); const w = $('#ddWit'); if (w) w.textContent = state.dd.witness || '—'; toast('Witness saved'); }
    else if (t.id === 'ddAdd' && t.value.trim()) {
      const pid = ensureProductByName(t.value); const pp = prod(pid); if (pp) pp.highRisk = true;
      state.dd.rows[pid] = state.dd.rows[pid] || {}; save(); const y = window.scrollY; renderView(); window.scrollTo(0, y); toast('Added to the DD check');
    }
    else if (t.id === 'setKw') { state.settings.highRiskKeywords = t.value.split(',').map((x) => x.trim().toLowerCase()).filter(Boolean); save(); toast('Keywords saved'); }
  });

  // Test hook for the automated browser checks
  window.__stockcheck = { get state() { return state; }, get thumbs() { return thumbs; }, handleRaw, setTab, batchGroups };

  save(); // persist a migration straight away
  renderNav(); renderView();
})();

</script>
