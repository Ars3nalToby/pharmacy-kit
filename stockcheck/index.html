<title>StockCheck v3</title>
<meta name="description" content="Store-level pharmacy stock and expiry checks on your own phone: photograph packs, read GS1 batch and expiry, catch short-dated stock.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one working column (max 1000px). Phone: tab bar fixed to the bottom, thumb-reachable.
   Desktop: tabs sit under the header. Codes (GTIN, batch, serial) always in mono, set like a shelf label. */
:root {
  --bg: #eef2f1;
  --surface: #ffffff;
  --surface-2: #f6f8f8;
  --ink: #13201e;
  --muted: #5a6b68;
  --line: #d6dfdd;
  --accent: #0a6b60;
  --accent-ink: #ffffff;
  --accent-soft: #dcefeb;
  --short: #b42318;
  --short-soft: #fbe6e3;
  --over: #9a5b00;
  --over-soft: #fbf0db;
  --ok: #26703a;
  --ok-soft: #e1f2e5;
  --risk: #5b3a96;
  --risk-soft: #ece5f7;
  --shadow: 0 1px 2px rgba(19, 32, 30, .06), 0 6px 20px rgba(19, 32, 30, .06);
  --f-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1514; --surface: #162120; --surface-2: #1b2826; --ink: #e4eeeb; --muted: #93a7a2; --line: #283836;
    --accent: #3fc2ad; --accent-ink: #062520; --accent-soft: #173a35;
    --short: #f08a7e; --short-soft: #3a1c19; --over: #e8b25c; --over-soft: #352914; --ok: #74cf8d; --ok-soft: #173020;
    --risk: #b9a0ec; --risk-soft: #2a2140; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1514; --surface: #162120; --surface-2: #1b2826; --ink: #e4eeeb; --muted: #93a7a2; --line: #283836;
  --accent: #3fc2ad; --accent-ink: #062520; --accent-soft: #173a35;
  --short: #f08a7e; --short-soft: #3a1c19; --over: #e8b25c; --over-soft: #352914; --ok: #74cf8d; --ok-soft: #173020;
  --risk: #b9a0ec; --risk-soft: #2a2140; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--f-body);
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(24px + env(safe-area-inset-bottom, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1000px; margin: 0 auto; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--f-display); font-stretch: 85%; letter-spacing: -0.01em; line-height: 1.15; text-wrap: balance; margin: 0; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.02rem; font-weight: 700; }
p { margin: 0; }
.mono { font-family: var(--f-mono); font-size: .86em; letter-spacing: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .84rem; }
.eyebrow { font-family: var(--f-display); font-stretch: 75%; font-weight: 700; font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

/* Header */
.top { display: flex; align-items: center; gap: 12px; padding-block: 18px 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-size: 1.7rem; font-weight: 800; font-stretch: 70%; letter-spacing: 0; }
.brand h1 b { color: var(--accent); font-weight: 800; }
.brand .store { color: var(--muted); font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .spacer { flex: 1; }
.datachip { font-size: .8rem; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.datachip.example { background: var(--over-soft); border-color: transparent; color: var(--over); }

/* Tabs: pinned to the top on every screen. A fixed bottom bar is avoided on purpose:
   when the app viewer stretches the page to its full height, a bottom-fixed bar ends up
   at the very end of a long page, out of reach. A second copy sits at the end of each page. */
.tabs {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 4px; margin: 0 auto 16px; max-width: 1000px;
  box-shadow: 0 6px 14px -12px rgba(19, 32, 30, .35);
}
.tabs button {
  position: relative; border: 0; background: none; padding: 6px 2px; border-radius: 9px; cursor: pointer; min-width: 0;
  display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted);
  font-family: var(--f-display); font-stretch: 80%; font-weight: 600; font-size: .78rem; letter-spacing: .02em;
}
.tabs button svg { width: 21px; height: 21px; }
.tabs button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.tabs .badge { position: absolute; top: 2px; left: calc(50% + 6px); background: var(--short); color: #fff; border-radius: 999px; font-size: .64rem; line-height: 1.5; padding: 0 5px; font-family: var(--f-body); font-weight: 700; }
.tabs .ico { display: inline-flex; }
.tabs.tabs-end { position: static; margin-top: 20px; box-shadow: none; }
@media (min-width: 760px) {
  .tabs { grid-template-columns: repeat(5, auto); justify-content: start; gap: 4px; }
  .tabs button { flex-direction: row; gap: 8px; padding: 8px 14px; font-size: .9rem; }
  .tabs button svg { width: 18px; height: 18px; }
  .tabs .badge { position: static; margin-left: -2px; }
}

/* Generic blocks */
.view { display: grid; gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.grid2 { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 860px) { .grid2 { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; } }

.banner { display: flex; gap: 10px; align-items: flex-start; background: var(--over-soft); color: var(--ink); border-radius: var(--r); padding: 12px 14px; font-size: .9rem; }
.banner b { color: var(--over); }
.banner.info { background: var(--accent-soft); }
.banner.info b { color: var(--accent); }
.banner.bad { background: var(--short-soft); }
.banner.bad b { color: var(--short); }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 2px; min-width: 0; }
.stat .v { font-family: var(--f-display); font-stretch: 80%; font-weight: 700; font-size: 1.6rem; line-height: 1.1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .v.bad { color: var(--short); } .stat .v.good { color: var(--ok); } .stat .v.warn { color: var(--over); }
.stat .l { font-size: .78rem; color: var(--muted); line-height: 1.3; }
.bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
@media (min-width: 760px) { .stats.four { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 759px) { .stats.four { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* Buttons & inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--short); border-color: color-mix(in srgb, var(--short) 40%, var(--line)); }
.btn.small { min-height: 34px; padding: 4px 12px; font-size: .86rem; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

label.f { display: grid; gap: 4px; font-size: .84rem; color: var(--muted); min-width: 0; }
input[type=text], input[type=search], input[type=number], input[type=date], select, textarea {
  width: 100%; min-height: 42px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
}
textarea { min-height: 110px; resize: vertical; font-family: var(--f-mono); font-size: .82rem; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.fields { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }

.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: .88rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* Chips & pills */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: .74rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.chip.bad { background: var(--short-soft); color: var(--short); border-color: transparent; }
.chip.warn, .chip.soon { background: var(--over-soft); color: var(--over); border-color: transparent; }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.risk { background: var(--risk-soft); color: var(--risk); border-color: transparent; }
.chip.money { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.sched { font-family: var(--f-display); font-stretch: 75%; font-weight: 800; font-size: .72rem; letter-spacing: .04em; padding: 1px 6px; border-radius: 4px; border: 1.5px solid currentColor; color: var(--muted); }
.sched.S8, .sched.S4D { color: var(--risk); }

/* Lists */
.list { display: grid; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; padding-top: 2px; }
.item .name { font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
.item .meta { color: var(--muted); font-size: .84rem; display: flex; gap: 6px 12px; flex-wrap: wrap; }
.item .side { text-align: right; display: grid; gap: 4px; justify-items: end; }
.item .chips { grid-column: 1 / -1; }
.rank { font-family: var(--f-display); font-stretch: 75%; font-weight: 700; color: var(--muted); font-size: .8rem; min-width: 1.4em; }

.empty { text-align: center; padding: 28px 12px; color: var(--muted); display: grid; gap: 8px; justify-items: center; }

/* Scan: the label card */
.capture { display: grid; gap: 12px; }
.shot {
  display: grid; place-items: center; gap: 6px; text-align: center; cursor: pointer;
  border: 2px dashed color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius: 14px; padding: 22px 12px;
  background: var(--accent-soft); color: var(--ink);
}
.shot:hover { border-color: var(--accent); }
.shot svg { width: 34px; height: 34px; color: var(--accent); }
.shot strong { font-family: var(--f-display); font-stretch: 85%; font-size: 1.15rem; }
.shot input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.scanbox { display: flex; gap: 8px; }
.scanbox input { font-family: var(--f-mono); font-size: .9rem; }
.preview { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); max-width: 100%; }
.preview canvas { display: block; width: 100%; height: auto; max-height: 340px; object-fit: contain; cursor: crosshair; }
.preview .status { position: absolute; left: 8px; bottom: 8px; right: 8px; background: color-mix(in srgb, var(--surface) 92%, transparent); border-radius: 8px; padding: 6px 10px; font-size: .84rem; display: flex; gap: 8px; align-items: center; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }

.label {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow);
}
.label .lhead { padding: 14px 16px 10px; display: grid; gap: 4px; border-bottom: 1px dashed var(--line); }
.label .lhead .pname { font-family: var(--f-display); font-stretch: 85%; font-weight: 700; font-size: 1.2rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.label .lbody { padding: 12px 16px 16px; display: grid; gap: 12px; }
.ai-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.ai-strip > div { padding: 8px 10px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; min-width: 0; }
.ai-strip .k { font-family: var(--f-mono); font-size: .7rem; color: var(--muted); }
.ai-strip .val { font-family: var(--f-mono); font-size: .92rem; font-weight: 600; overflow-wrap: anywhere; }
.warnlist { display: grid; gap: 6px; }
.warnlist p { font-size: .86rem; padding: 6px 10px; border-radius: 8px; background: var(--over-soft); }
.warnlist p.bad { background: var(--short-soft); }
.stepper { display: inline-flex; align-items: stretch; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface-2); }
.stepper button { width: 44px; border: 0; background: none; font-size: 1.3rem; cursor: pointer; }
.stepper input { width: 70px; text-align: center; border: 0; border-radius: 0; background: var(--surface); font-weight: 700; font-variant-numeric: tabular-nums; }
.tally { display: flex; gap: 14px; flex-wrap: wrap; font-size: .9rem; padding: 8px 12px; border-radius: 8px; background: var(--surface-2); }
.tally b { font-variant-numeric: tabular-nums; }
.added { display: flex; gap: 8px; align-items: center; color: var(--ok); font-weight: 600; }

/* Variance rows */
.vrow { border-top: 1px solid var(--line); }
.vrow:first-child { border-top: 0; }
.vrow > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 6px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 12px 0; }
.vrow > summary::-webkit-details-marker { display: none; }
.vrow .stripe { align-self: stretch; border-radius: 3px; background: var(--line); }
.vrow.short .stripe { background: var(--short); } .vrow.over .stripe { background: var(--over); } .vrow.match .stripe { background: var(--ok); }
.vrow .vnums { text-align: right; font-variant-numeric: tabular-nums; display: grid; justify-items: end; }
.vrow .delta { font-family: var(--f-display); font-stretch: 80%; font-weight: 700; font-size: 1.15rem; }
.vrow.short .delta { color: var(--short); } .vrow.over .delta { color: var(--over); } .vrow.match .delta { color: var(--ok); }
.vdetail { padding: 0 0 16px 18px; display: grid; gap: 10px; }
.hint { font-size: .88rem; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); border-left: 3px solid var(--line); }
.hint.mirror { border-left-color: var(--risk); } .hint.loss, .hint.system, .hint.expired { border-left-color: var(--short); } .hint.receiving, .hint.ledger { border-left-color: var(--over); } .hint.over { border-left-color: var(--over); }
.tablewrap { overflow-x: auto; }
.ddlist { display: grid; gap: 10px; margin-top: 10px; }
.ddrow { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, .8fr) minmax(0, .8fr) minmax(0, 1fr); gap: 8px 10px; align-items: end; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.ddname { display: grid; gap: 2px; min-width: 0; align-self: center; }
.ddname b { overflow-wrap: anywhere; }
.ddstat { align-self: center; }
.ddnote { grid-column: 1 / -1; }
.ddtools { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 10px; margin-top: 12px; }
.chip.ddok { background: var(--ok-soft); color: var(--ok); }
.chip.ddbad { background: var(--short-soft); color: var(--short); }
@media (max-width: 560px) { .ddrow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .ddname { grid-column: 1 / -1; } .ddtools { grid-template-columns: minmax(0, 1fr); } }
table.t { border-collapse: collapse; width: 100%; font-size: .86rem; }
table.t th, table.t td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t th { font-weight: 600; color: var(--muted); font-size: .76rem; text-transform: uppercase; letter-spacing: .05em; }
table.t td.r, table.t th.r { text-align: right; font-variant-numeric: tabular-nums; }
.ledger { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); overflow-wrap: anywhere; }

.confirm { display: grid; gap: 10px; padding: 12px; border-radius: 10px; background: var(--short-soft); }
.confirm.neutral { background: var(--accent-soft); }

/* Toast */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 30;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 14px; display: flex; gap: 14px; align-items: center;
  box-shadow: var(--shadow); max-width: calc(100vw - 32px); font-size: .9rem;
}
.toast button { background: none; border: 0; color: var(--accent-soft); font-weight: 700; cursor: pointer; text-decoration: underline; }

.foot { margin-top: 28px; color: var(--muted); font-size: .8rem; text-align: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
/* Reserve the expiry chip's line so typing an expiry never shifts the Add button under a finger */
#expChips { min-height: 24px; }
/* Filter row: one swipeable line on phones instead of a wrapped block */
.seg.filters { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; min-width: 0; flex: 0 1 auto; scrollbar-width: none; }
.seg.filters::-webkit-scrollbar { display: none; }
.seg.filters button { white-space: nowrap; flex: none; }
.datachip.pilot { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 600; }
ol.steps { margin: 0; padding-left: 1.3em; display: grid; gap: 8px; }
ol.steps li { padding-left: 4px; }
ol.steps li::marker { font-family: var(--f-display); font-weight: 700; color: var(--accent); }
.hint.okhint { border-left-color: var(--ok); }

/* v2 pieces */
.welcome { gap: 14px; padding: 20px; }
.welcome h2 { font-size: 1.6rem; }
button.stat.linkstat { text-align: left; font: inherit; color: inherit; cursor: pointer; }
button.stat.linkstat:hover { border-color: var(--muted); }
.link.rowlink { text-align: left; text-decoration: none; color: var(--ink); }
.thumb { width: 48px; height: 48px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); flex: none; background: var(--surface-2); }
.evidence { display: flex; gap: 10px; align-items: center; padding: 8px; border: 1px dashed var(--line); border-radius: 10px; }

<p class="foot wrap">StockCheck runs on your phone and keeps everything there. Built for GS1 DataMatrix packs (GTIN, batch, expiry, serial).</p>
<script>
/* StockCheck core — pure functions, no DOM. Shared by the page and the Node tests. */
(function (root) {
  'use strict';

  const GS = '\x1d';

  /* ---------- GTIN helpers ---------- */

  function gs1CheckDigit(body) {
    // body: digit string without the check digit. Weights 3,1,3,1… from the right.
    let sum = 0;
    for (let i = 0; i < body.length; i++) {
      const d = body.charCodeAt(body.length - 1 - i) - 48;
      sum += d * (i % 2 === 0 ? 3 : 1);
    }
    return (10 - (sum % 10)) % 10;
  }

  function isValidGtin(code) {
    const s = String(code || '').replace(/\D/g, '');
    if (![8, 12, 13, 14].includes(s.length)) return false;
    return gs1CheckDigit(s.slice(0, -1)) === Number(s[s.length - 1]);
  }

  function withCheckDigit(body) {
    return body + gs1CheckDigit(body);
  }

  // Normalise any GTIN-8/12/13/14 to a comparison key (GTIN-14, zero padded).
  function gtinKey(code) {
    const s = String(code || '').replace(/\D/g, '');
    if (!s || s.length > 14) return '';
    return s.padStart(14, '0');
  }

  /* ---------- Dates ---------- */

  function pad2(n) { return String(n).padStart(2, '0'); }
  function isoDate(y, m, d) { return y + '-' + pad2(m) + '-' + pad2(d); }
  function lastDayOfMonth(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }

  // GS1 YYMMDD. DD = 00 means "end of month". Century follows the GS1 sliding window
  // (-49..+50 years around the reference year).
  function parseGs1Date(yymmdd, refYear) {
    if (!/^\d{6}$/.test(yymmdd)) return null;
    const yy = Number(yymmdd.slice(0, 2));
    const mm = Number(yymmdd.slice(2, 4));
    let dd = Number(yymmdd.slice(4, 6));
    if (mm < 1 || mm > 12) return null;
    const ref = refYear || new Date().getUTCFullYear();
    const refCentury = Math.floor(ref / 100) * 100;
    let year = refCentury + yy;
    const diff = year - ref;
    if (diff > 50) year -= 100;
    else if (diff < -49) year += 100;
    const last = lastDayOfMonth(year, mm);
    if (dd === 0) dd = last;
    if (dd > last) return null;
    return isoDate(year, mm, dd);
  }

  function daysBetween(fromIso, toIso) {
    const a = Date.parse(fromIso.slice(0, 10) + 'T00:00:00Z');
    const b = Date.parse(toIso.slice(0, 10) + 'T00:00:00Z');
    return Math.round((b - a) / 86400000);
  }

  function todayIso(now) {
    if (typeof now === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(now)) return now; // already a calendar date
    const d = now ? new Date(now) : new Date();
    return isoDate(d.getFullYear(), d.getMonth() + 1, d.getDate());
  }

  // Accept typed expiry: 2028-05-31, 31/05/2028, 05/2028, 05/28, 2028-05, MAY 2028, 280531
  const MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
  function parseLooseExpiry(text, refYear) {
    if (!text) return null;
    const t = String(text).trim().toLowerCase().replace(/^(exp(iry)?|use by|best before)[:.\s]*/i, '');
    let m;
    const fixYear = (y) => (y.length === 2 ? 2000 + Number(y) : Number(y));
    if ((m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) return validDate(+m[1], +m[2], +m[3]);
    if ((m = t.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2}|\d{4})$/))) return validDate(fixYear(m[3]), +m[2], +m[1]);
    if ((m = t.match(/^(\d{4})[\/.\-](\d{1,2})$/))) return endOfMonth(+m[1], +m[2]);
    if ((m = t.match(/^(\d{1,2})[\/.\-\s](\d{2}|\d{4})$/))) return endOfMonth(fixYear(m[2]), +m[1]);
    if ((m = t.match(/^([a-z]{3})[a-z]*[\s\-\/.]*(\d{2}|\d{4})$/)) && MONTHS[m[1]]) return endOfMonth(fixYear(m[2]), MONTHS[m[1]]);
    if ((m = t.match(/^(\d{6})$/))) return parseGs1Date(m[1], refYear);
    return null;
    function endOfMonth(y, mo) { return mo >= 1 && mo <= 12 ? isoDate(y, mo, lastDayOfMonth(y, mo)) : null; }
    function validDate(y, mo, d) { return mo >= 1 && mo <= 12 && d >= 1 && d <= lastDayOfMonth(y, mo) ? isoDate(y, mo, d) : null; }
  }

  /* ---------- GS1 element string parser ---------- */

  // fixed: exact length; v: variable max length. Only AIs seen on medicine packs, plus a few common ones.
  const AI = {
    '00': { fixed: 18, key: 'sscc', label: 'SSCC' },
    '01': { fixed: 14, key: 'gtin', label: 'GTIN' },
    '02': { fixed: 14, key: 'content', label: 'Content GTIN' },
    '10': { v: 20, key: 'batch', label: 'Batch/Lot' },
    '11': { fixed: 6, key: 'prodDate', label: 'Production date', date: true },
    '15': { fixed: 6, key: 'bestBefore', label: 'Best before', date: true },
    '17': { fixed: 6, key: 'expiry', label: 'Expiry', date: true },
    '21': { v: 20, key: 'serial', label: 'Serial' },
    '22': { v: 20, key: 'cpv', label: 'Variant' },
    '30': { v: 8, key: 'count', label: 'Count' },
    '37': { v: 8, key: 'count', label: 'Count' },
    '240': { v: 30, key: 'addId', label: 'Additional ID' },
    '710': { v: 20, key: 'nhrn', label: 'NHRN (DE)' },
    '711': { v: 20, key: 'nhrn', label: 'NHRN (FR)' },
    '712': { v: 20, key: 'nhrn', label: 'NHRN (ES)' },
    '713': { v: 20, key: 'nhrn', label: 'NHRN (BR)' },
    '714': { v: 20, key: 'nhrn', label: 'NHRN (PT)' },
  };

  function normaliseScan(raw) {
    let s = String(raw == null ? '' : raw);
    // Common ways scanners/keyboards render FNC1 / GS
    s = s.replace(/<GS>|\{GS\}|\[GS\]|␝|␝|\^\]/gi, GS);
    s = s.replace(/\r|\n/g, '');
    // Symbology identifiers: ]d2 (GS1 DataMatrix), ]C1 (GS1-128), ]Q3 (GS1 QR), ]e0 (DataBar)
    s = s.replace(/^\][A-Za-z]\d/, '');
    // A leading FNC1 is just the GS1 flag
    while (s[0] === GS) s = s.slice(1);
    return s.trim();
  }

  function parseGs1(raw, opts) {
    const refYear = opts && opts.refYear;
    const out = { ok: false, kind: 'unknown', fields: {}, elements: [], warnings: [], raw: String(raw == null ? '' : raw) };
    const s = normaliseScan(raw);
    if (!s) { out.warnings.push('Empty scan'); return out; }

    // Plain linear barcode (EAN-13 / UPC / GTIN-14 / EAN-8)
    if (/^\d+$/.test(s) && [8, 12, 13, 14].includes(s.length)) {
      if (isValidGtin(s)) {
        out.ok = true; out.kind = 'linear';
        out.fields.gtin = gtinKey(s);
        out.elements.push({ ai: '', label: 'GTIN', value: s });
        return out;
      }
    }

    // Human-readable form with brackets: (01)…(17)…(10)…
    if (/^\(\d{2,4}\)/.test(s)) {
      const re = /\((\d{2,4})\)([^(]*)/g;
      let m;
      while ((m = re.exec(s))) addElement(out, m[1], m[2].replace(new RegExp(GS, 'g'), '').trim(), refYear);
      out.kind = 'gs1';
      finish(out);
      return out;
    }

    // Raw element string
    const hasGS = s.indexOf(GS) !== -1;
    let i = 0;
    let guard = 0;
    while (i < s.length && guard++ < 40) {
      if (s[i] === GS) { i++; continue; }
      let ai = null;
      for (const len of [2, 3, 4]) {
        const cand = s.substr(i, len);
        if (AI[cand]) { ai = cand; break; }
      }
      if (!ai) {
        out.warnings.push('Unrecognised data at position ' + i + ': "' + s.slice(i, i + 8) + '…"');
        break;
      }
      const def = AI[ai];
      i += ai.length;
      let value;
      if (def.fixed) {
        value = s.substr(i, def.fixed);
        i += def.fixed;
      } else {
        let end = s.indexOf(GS, i);
        if (end === -1) end = s.length;
        value = s.slice(i, end);
        if (value.length > def.v) {
          // No separator where one was needed. Split at the max length and flag it.
          out.warnings.push(def.label + ' ran past its maximum length — the scanner may have dropped a separator. Check the printed ' + def.label.toLowerCase() + '.');
          value = value.slice(0, def.v);
          end = i + def.v;
        } else if (!hasGS && end === s.length && i !== s.length && def.key === 'batch' && /21[A-Za-z0-9]{6,}$/.test(value) && value.length > 12) {
          out.warnings.push('No group separator found, so the batch may contain the serial number. Check the printed batch.');
        }
        i = end;
      }
      addElement(out, ai, value, refYear);
    }
    out.kind = 'gs1';
    finish(out);
    return out;
  }

  function addElement(out, ai, value, refYear) {
    const def = AI[ai];
    if (!def) { out.warnings.push('Unknown AI (' + ai + ')'); return; }
    const el = { ai, label: def.label, value };
    if (def.date) {
      const iso = parseGs1Date(value, refYear);
      if (!iso) out.warnings.push(def.label + ' "' + value + '" is not a valid date');
      el.iso = iso;
      out.fields[def.key] = iso;
    } else if (def.key === 'gtin') {
      if (!isValidGtin(value)) out.warnings.push('GTIN check digit does not match — rescan');
      out.fields.gtin = gtinKey(value);
    } else {
      out.fields[def.key] = value;
    }
    out.elements.push(el);
  }

  function finish(out) {
    out.ok = !!out.fields.gtin && !out.warnings.some((w) => /check digit|not a valid date/.test(w));
    if (!out.fields.gtin) out.warnings.push('No GTIN (01) found');
  }

  /* ---------- CSV ---------- */

  function detectDelimiter(text) {
    const head = text.split(/\r?\n/).slice(0, 5).join('\n');
    const counts = { ',': 0, '\t': 0, ';': 0, '|': 0 };
    let q = false;
    for (const ch of head) {
      if (ch === '"') q = !q;
      else if (!q && ch in counts) counts[ch]++;
    }
    return Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
  }

  function parseCsv(text, delim) {
    text = String(text || '').replace(/^﻿/, '');
    const d = delim || detectDelimiter(text);
    const rows = [];
    let row = [], field = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; } else q = false;
        } else field += c;
      } else if (c === '"' && field === '') q = true;
      else if (c === d) { row.push(field); field = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field); field = '';
        if (row.some((x) => x.trim() !== '')) rows.push(row);
        row = [];
      } else field += c;
    }
    row.push(field);
    if (row.some((x) => x.trim() !== '')) rows.push(row);
    return rows;
  }

  const FIELD_SYNONYMS = {
    barcode: ['apn', 'gtin', 'barcode', 'ean', 'ean13', 'upc', 'barcode1', 'primarybarcode', 'apncode'],
    pde: ['pde', 'pdecode', 'itemcode', 'productcode', 'code', 'sku', 'plu', 'stockcode', 'itemno', 'productid', 'id'],
    name: ['description', 'name', 'productname', 'product', 'item', 'itemdescription', 'drug', 'drugname', 'productdescription', 'desc'],
    soh: ['soh', 'stockonhand', 'onhand', 'qtyonhand', 'qoh', 'stock', 'qty', 'quantity', 'systemsoh', 'currentsoh'],
    cost: ['cost', 'unitcost', 'avgcost', 'averagecost', 'wac', 'costprice', 'costex', 'lastcost'],
    dispensed: ['dispensed', 'mtddispensed', 'disp', 'qtydispensed', 'dispensedqty', 'mtddisp', 'scripts'],
    sold: ['sold', 'otcsold', 'salesqty', 'qtysold', 'mtdsales', 'mtdsold', 'unitssold', 'sales'],
    received: ['received', 'invoiced', 'mtdreceived', 'purchases', 'qtyreceived', 'invoiceqty', 'mtdinvoiced', 'mtdpurchases', 'receipted'],
    opening: ['opening', 'openingsoh', 'monthstart', 'startsoh', 'openingstock', 'openingqty'],
    schedule: ['schedule', 'sched', 'poisonschedule', 'class', 'drugschedule'],
    location: ['location', 'bin', 'shelf', 'bay', 'loc'],
    packSize: ['packsize', 'pack', 'qtyperpack', 'packqty'],
  };

  function normHeader(h) { return String(h || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }

  function mapColumns(headers) {
    const norm = headers.map(normHeader);
    const map = {};
    const used = new Set();
    // pass 1: exact; pass 2: contains
    for (const pass of [1, 2]) {
      for (const field of Object.keys(FIELD_SYNONYMS)) {
        if (map[field] !== undefined) continue;
        const syns = FIELD_SYNONYMS[field];
        for (let i = 0; i < norm.length; i++) {
          if (used.has(i) || !norm[i]) continue;
          const hit = pass === 1 ? syns.includes(norm[i]) : syns.some((s) => s.length > 3 && norm[i].includes(s));
          if (hit) { map[field] = i; used.add(i); break; }
        }
      }
    }
    return map;
  }

  function parseNum(v) {
    if (v == null) return null;
    let s = String(v).trim();
    if (!s) return null;
    let neg = false;
    if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
    s = s.replace(/[$,\s]/g, '');
    if (s.endsWith('-')) { neg = true; s = s.slice(0, -1); }
    const n = Number(s);
    if (!isFinite(n)) return null;
    return neg ? -n : n;
  }

  function normaliseSchedule(v) {
    const s = String(v || '').toUpperCase().replace(/\s/g, '');
    const m = s.match(/^S?(2|3|4D|4|8)$/) || s.match(/SCHEDULE(2|3|4D|4|8)/);
    return m ? 'S' + m[1] : (s ? s.slice(0, 4) : '');
  }

  function rowsToProducts(rows, map, opts) {
    const o = opts || {};
    const out = [];
    const errors = [];
    for (let r = 1; r < rows.length; r++) {
      const row = rows[r];
      const get = (f) => (map[f] !== undefined ? row[map[f]] : undefined);
      const name = (get('name') || '').trim();
      const barcode = String(get('barcode') || '').replace(/\D/g, '');
      const pde = String(get('pde') || '').trim();
      if (!name && !barcode && !pde) continue;
      const soh = parseNum(get('soh'));
      if (soh === null && map.soh !== undefined) errors.push('Row ' + (r + 1) + ': SOH "' + get('soh') + '" is not a number');
      const p = {
        id: pde || barcode || 'row' + r,
        name: name || '(no description)',
        pde,
        barcode,
        gtin: barcode && barcode.length <= 14 ? gtinKey(barcode) : '',
        soh: soh === null ? 0 : soh,
        cost: parseNum(get('cost')),
        dispensed: parseNum(get('dispensed')),
        sold: parseNum(get('sold')),
        received: parseNum(get('received')),
        opening: parseNum(get('opening')),
        schedule: normaliseSchedule(get('schedule')),
        location: (get('location') || '').trim(),
        packSize: parseNum(get('packSize')),
      };
      out.push(p);
    }
    // de-duplicate ids
    const seen = {};
    for (const p of out) {
      if (seen[p.id]) { seen[p.id]++; p.id = p.id + '~' + seen[p.id]; } else seen[p.id] = 1;
    }
    return { products: out, errors, highRiskDefault: o.highRiskDefault };
  }

  function toCsv(rows) {
    return rows.map((r) => r.map((v) => {
      const s = v == null ? '' : String(v);
      return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(',')).join('\r\n');
  }

  /* ---------- Product matching ---------- */

  function buildIndex(products, links) {
    const byGtin = {};
    const byId = {};
    for (const p of products) {
      byId[p.id] = p;
      if (p.gtin) byGtin[p.gtin] = p.id;
    }
    for (const g in links || {}) if (byId[links[g]]) byGtin[g] = links[g];
    return { byGtin, byId };
  }

  function searchProducts(products, q, limit) {
    const terms = String(q || '').toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length) return [];
    const scored = [];
    for (const p of products) {
      const hay = (p.name + ' ' + p.pde + ' ' + p.barcode).toLowerCase();
      if (terms.every((t) => hay.includes(t))) {
        const starts = p.name.toLowerCase().startsWith(terms[0]) ? 0 : 1;
        scored.push([starts, p.name.length, p]);
      }
    }
    scored.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    return scored.slice(0, limit || 8).map((x) => x[2]);
  }

  /* ---------- Variance engine ---------- */

  // "Atorvastatin 40mg tab 30" → "atorvastatin"; brand-first names fall back to the first word.
  function moleculeKey(name) {
    const w = String(name || '').toLowerCase().replace(/[^a-z\s]/g, ' ').split(/\s+/).filter((x) => x.length > 2);
    return w[0] || '';
  }

  function strengthOf(name) {
    const m = String(name || '').match(/(\d+(?:\.\d+)?)\s*(mg|mcg|microgram|g|ml|%|iu)/i);
    return m ? m[1] + m[2].toLowerCase() : '';
  }

  function ledgerExpected(p) {
    if (p.opening == null) return null;
    return p.opening + (p.received || 0) - (p.dispensed || 0) - (p.sold || 0);
  }

  function isHighRisk(p, settings) {
    if (p.highRisk === true) return true;
    if (p.highRisk === false) return false;
    if (p.schedule === 'S8' || p.schedule === 'S4D') return true;
    const kws = (settings && settings.highRiskKeywords) || [];
    const n = p.name.toLowerCase();
    return kws.some((k) => k && n.includes(k));
  }

  function countsByProduct(counts) {
    const map = {};
    for (const c of counts) {
      if (!c.productId) continue;
      const m = map[c.productId] || (map[c.productId] = { qty: 0, batches: {}, lines: [] });
      m.qty += c.qty;
      m.lines.push(c);
      const bk = (c.batch || '—') + '|' + (c.expiry || '');
      const b = m.batches[bk] || (m.batches[bk] = { batch: c.batch || '', expiry: c.expiry || '', qty: 0, serials: [] });
      b.qty += c.qty;
      if (c.serial) b.serials.push(c.serial);
    }
    return map;
  }

  function analyse(products, counts, settings, now) {
    const today = todayIso(now);
    const cbp = countsByProduct(counts);
    const rows = [];
    for (const p of products) {
      const c = cbp[p.id];
      const counted = c ? c.qty : null;
      const variance = counted === null ? null : round2(counted - p.soh);
      const cost = p.cost || 0;
      const led = ledgerExpected(p);
      const batches = c ? Object.values(c.batches).sort((a, b) => (a.expiry || '9').localeCompare(b.expiry || '9')) : [];
      const expiredQty = batches.filter((b) => b.expiry && b.expiry < today).reduce((s, b) => s + b.qty, 0);
      let status = 'uncounted';
      if (counted !== null) status = variance === 0 ? 'match' : variance < 0 ? 'short' : 'over';
      rows.push({
        product: p,
        counted,
        variance,
        value: variance === null ? null : round2(variance * cost),
        ledger: led,
        ledgerGap: led === null ? null : round2(p.soh - led),
        batches,
        expiredQty,
        status,
        hints: [],
        highRisk: isHighRisk(p, settings),
      });
    }
    addHints(rows, today);
    return rows;
  }

  function addHints(rows, today) {
    const groups = {};
    for (const r of rows) {
      const k = moleculeKey(r.product.name);
      (groups[k] || (groups[k] = [])).push(r);
    }
    for (const r of rows) {
      const p = r.product;
      if (p.soh < 0) r.hints.push({ type: 'system', text: 'System SOH is negative. Stock went out before it was receipted — look for an unreceived invoice or a transfer in.' });
      if (r.ledgerGap) r.hints.push({ type: 'ledger', text: 'System SOH is ' + signed(r.ledgerGap) + ' against opening + received − dispensed − sold. Something moved without a matching transaction (adjustment, transfer, return).' });
      if (r.status === 'uncounted' || !r.variance) continue;
      const v = r.variance;
      // Mirror variance in a sibling (same molecule, different strength/brand)
      const sibs = (groups[moleculeKey(p.name)] || []).filter((s) => s !== r && s.variance && Math.sign(s.variance) === -Math.sign(v));
      const mirror = sibs.find((s) => Math.abs(s.variance) === Math.abs(v)) || sibs[0];
      if (mirror) {
        r.hints.push({ type: 'mirror', text: 'Mirror variance with ' + mirror.product.name + ' (' + signed(mirror.variance) + '). Likely the wrong strength or brand was selected at dispensing or receiving.', ref: mirror.product.id });
      }
      if (v < 0 && p.received && -v === p.received) r.hints.push({ type: 'receiving', text: 'Short by exactly this month’s received quantity. Check the invoice was actually delivered and put away.' });
      if (v < 0 && p.packSize > 1 && -v % p.packSize === 0 && -v >= p.packSize && -v !== p.received) r.hints.push({ type: 'receiving', text: 'Short by a whole outer (' + p.packSize + '). An outer may be unopened in the back, or receipted twice.' });

<script>
/* StockCheck barcode decoding — shared by the page and Node tests.

  function makeReader(ZXing, formats) {
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

    reader.setHints(hints);

    return out;

  async function decodeGrayAsync(ZXing, gray, w, h, onProgress) {

  function imageQuality(gray, w, h) {

  }

    scan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 8h3v3H8zM13 8h3M13 11h1M8 13h1M11 13h5v3h-3M8 16h3"/></svg>',
    expiry: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4M10 14l4 4M14 14l-4 4"/></svg>',
    report: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20h16"/><path d="M7 16v-5M12 16V7M17 16v-8"/></svg>',
    settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M4.2 6.2l2.1 2.1M17.7 15.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 17.8l2.1-2.1M17.7 8.3l2.1-2.1"/></svg>',
    camera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a1 1 0 0 1 1-1h3l1.5-2h5L16 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><circle cx="12" cy="12.5" r="3.5"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4 10-10"/></svg>',
    down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
    spark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></svg>',
  };

  /* ================= State ================= */

  function defaultSettings() {
    return {
      store: '', who: '', scanMode: 'each', lastLocation: '', soonDays: 90,
      highRiskKeywords: ['mounjaro', 'ozempic', 'wegovy', 'saxenda', 'cannabis', 'cbd', 'thc', 'endone', 'oxycodone', 'oxynorm', 'targin', 'palexia', 'tapentadol', 'morphine', 'fentanyl', 'methylphenidate', 'dexamfetamine', 'lisdexamfetamine', 'alprazolam'],
    };
  }
  function newRound() { return { id: uid(), startedAt: new Date().toISOString(), lines: [] }; }
  function emptyState(settings) { return { v: 2, settings: settings || defaultSettings(), products: [], round: newRound(), history: [], attempts: [] }; }
  function pick(o, keys) { const r = {}; for (const k of keys) if (o[k] !== undefined) r[k] = o[k]; return r; }

  // v1 → v2: example data is dropped; real counts, pilot logs and settings carry over.
  function migrate(old) {
    if (!old || typeof old !== 'object') return emptyState();
    if (old.v === 2) return old;
    const keep = Object.assign(defaultSettings(), pick(old.settings || {}, ['store', 'who', 'scanMode', 'lastLocation', 'highRiskKeywords']));
    if (keep.store === 'Dispensary') keep.store = '';
    if (old.v !== 1 || old.source === 'example') { keep.lastLocation = ''; return emptyState(keep); }
    const toLines = (counts) => (counts || []).map((c) => ({ id: c.id || uid(), productId: c.productId, gtin: c.gtin || '', batch: c.batch || '', expiry: c.expiry || '', serial: c.serial || '', qty: c.qty || 0, location: c.location || '', at: c.at, source: c.source || 'scan', who: c.who || '' }));
    return {
      v: 2, settings: keep,
      products: (old.products || []).map((p) => ({ id: p.id, gtin: p.gtin || '', barcode: p.barcode || '', name: p.name || 'Unnamed product', lastChecked: p.lastCounted || null, highRisk: p.highRisk })),
      round: { id: (old.session && old.session.id) || uid(), startedAt: (old.session && old.session.startedAt) || new Date().toISOString(), lines: toLines(old.session && old.session.counts) },
      history: (old.history || []).map((h) => ({ id: h.id, startedAt: h.startedAt, finishedAt: h.finishedAt, lines: toLines(h.counts) })),
      attempts: (old.pilot && old.pilot.attempts) || [],
    };
  }

  let state, storageOk = true;
  try { state = migrate(JSON.parse(localStorage.getItem(KEY) || 'null')); } catch (e) { storageOk = false; state = emptyState(); }
  state.settings = Object.assign(defaultSettings(), state.settings || {});
  state.products = state.products || []; state.history = state.history || []; state.attempts = state.attempts || [];
  state.round = state.round || newRound();
  state.dd = state.dd || { startedAt: null, witness: '', rows: {} };

  let saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(state)); storageOk = true; } catch (e) { storageOk = false; } }, 150);
  }

  /* --- evidence thumbnails, stored apart so they can never crowd out the counts --- */
  let thumbs = {};
  try { thumbs = JSON.parse(localStorage.getItem(THUMB_KEY) || '{}') || {}; } catch (e) { thumbs = {}; }
  function saveThumbs() {
    for (let tries = 0; tries < 6; tries++) {
      try { localStorage.setItem(THUMB_KEY, JSON.stringify(thumbs)); return true; } catch (e) {
        const keys = Object.keys(thumbs); if (!keys.length) return false;
        keys.slice(0, Math.max(1, Math.ceil(keys.length / 5))).forEach((k) => delete thumbs[k]); // drop the oldest fifth, retry
      }
    }
    return false;
  }
  function addThumb(canvas) {
    try {
      const f = Math.min(1, 360 / Math.max(canvas.width, canvas.height));
      const c = document.createElement('canvas');
      c.width = Math.round(canvas.width * f); c.height = Math.round(canvas.height * f);
      c.getContext('2d').drawImage(canvas, 0, 0, c.width, c.height);
      const id = 't' + uid();
      thumbs[id] = c.toDataURL('image/jpeg', 0.62);
      const keys = Object.keys(thumbs);
      if (keys.length > MAX_THUMBS) keys.slice(0, keys.length - MAX_THUMBS).forEach((k) => delete thumbs[k]);
      saveThumbs();
      return thumbs[id] ? id : null;
    } catch (e) { return null; }
  }
  function dropThumbs(lines) { let ch = false; for (const l of lines) if (l.thumb && thumbs[l.thumb]) { delete thumbs[l.thumb]; ch = true; } if (ch) saveThumbs(); }

  /* --- products come from the pack --- */
  let byId = {}, byGtin = {};
  function reindex() { byId = {}; byGtin = {}; for (const p of state.products) { byId[p.id] = p; if (p.gtin) byGtin[p.gtin] = p.id; } }
  reindex();
  const prod = (id) => byId[id];
  const isUnnamed = (p) => !p || !p.name || p.name === 'Unnamed product';
  function ensureProductFromGtin(gtin) {
    if (!gtin || !SC.isValidGtin(gtin)) return null;
    if (byGtin[gtin]) return byGtin[gtin];
    const p = { id: 'G' + gtin, gtin, barcode: gtin.length === 14 && gtin[0] === '0' ? gtin.slice(1) : gtin, name: 'Unnamed product', lastChecked: null };
    state.products.push(p); reindex();
    return p.id;
  }
  function ensureProductByName(name) {
    const n = String(name || '').trim(); if (!n) return null;
    const hit = state.products.find((p) => p.name.toLowerCase() === n.toLowerCase());
    if (hit) return hit.id;
    const p = { id: 'N' + uid(), gtin: '', barcode: '', name: n, lastChecked: null };
    state.products.push(p); reindex();
    return p.id;
  }

  function logAttempt(a) {
    const rec = Object.assign({ id: uid(), at: new Date().toISOString(), who: state.settings.who || '' }, a);
    state.attempts.push(rec);
    if (state.attempts.length > 3000) state.attempts.splice(0, state.attempts.length - 3000);
    save();
    return rec;
  }
  const kindOf = (r) => (!r ? 'none' : r.kind === 'gs1' ? 'datamatrix' : 'linear');

  /* --- batches: the current round wins; products not seen this round use their latest finished round --- */
  function batchGroups() {
    const groups = new Map();
    const seen = new Set();
    const take = (lines, label) => {
      const pids = new Set();
      for (const l of lines) {
        if (!l.productId || seen.has(l.productId)) continue;
        pids.add(l.productId);
        const k = l.productId + '|' + (l.batch || '') + '|' + (l.expiry || '');
        const g = groups.get(k) || { key: k, productId: l.productId, batch: l.batch || '', expiry: l.expiry || '', qty: 0, removedQty: 0, lines: [], label, thumb: null, location: '' };
        if (l.removed) g.removedQty += l.qty; else g.qty += l.qty;
        g.lines.push(l);
        if (l.thumb && thumbs[l.thumb]) g.thumb = l.thumb;
        if (l.location) g.location = l.location;
        groups.set(k, g);
      }
      pids.forEach((p) => seen.add(p));
    };
    take(state.round.lines, 'This round');
    for (const h of state.history) take(h.lines, 'Round ' + fmtDate(h.finishedAt));
    const out = Array.from(groups.values());
    for (const g of out) g.removed = g.qty === 0 && g.removedQty > 0;
    return out;
  }

  /* ================= Capabilities (optional) ================= */

  const caps = { downloads: null, sample: null, images: null };
  (async () => {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    try { caps.downloads = await window.claude.use('downloads'); } catch (e) { caps.downloads = null; }
    try {
      caps.sample = await window.claude.use('sample');
      if (caps.sample) { const l = await caps.sample.limits().catch(() => null); caps.images = l && l.images ? l.images : null; }
    } catch (e) { caps.sample = null; }
    const a = document.activeElement;
    if (!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) renderView();
  })();
  const canAskClaude = () => !!(caps.sample && caps.images);

  /* ================= Shell ================= */

  const TABS = [['today', 'Today'], ['scan', 'Scan'], ['expiry', 'Expiry'], ['report', 'Report'], ['settings', 'Settings']];
  let tab = (location.hash || '').slice(1);
  if (tab === 'data') tab = 'settings';
  if (!TABS.some((t) => t[0] === tab)) tab = 'today';
  const ui = { method: 'photo', confirm: null, current: null, photo: null, searchQuery: '', recall: '', showPulled: false, fileFallback: null };

  function toTop() {
    try { window.scrollTo({ top: 0 }); } catch (e) { /* ignore */ }
    try { const h = $('#hdr'); if (h) h.scrollIntoView({ block: 'start' }); } catch (e) { /* ignore */ }
  }
  function setTab(t) {
    tab = t; renderNav(); renderView(); toTop();
    if (t === 'scan') { preloadZXing(); setTimeout(() => { if (ui.method === 'scanner') { const i = $('#scanInput'); if (i) i.focus(); } }, 50); }
  }
  function expiryCounts() {
    const b = SC.expiryBuckets(batchGroups().filter((g) => !g.removed), today(), state.settings.soonDays);
    return { expired: b.expired.length, soon: b.d90.length, buckets: b };
  }
  function renderHeader() {
    const s = state.settings;
    $('#hdr').innerHTML = '<div class="brand"><h1>Stock<b>Check</b></h1>' + (s.store ? '<span class="store">' + esc(s.store) + '</span>' : '') + '</div><span class="spacer"></span>' +
      (s.who ? '<span class="datachip pilot">' + esc(s.who) + '</span>' : '<button class="datachip example" data-act="tab" data-tab="settings">Set your name</button>');
  }
  function renderNav() {
    const alert = expiryCounts().expired;
    const navHtml = TABS.map(([k, label]) =>
      '<button type="button" data-act="tab" data-tab="' + k + '"' + (tab === k ? ' aria-current="page"' : '') + '>' +
      '<span class="ico">' + ICON[k] + '</span>' + label +
      (k === 'expiry' && alert ? '<span class="badge" aria-label="' + alert + ' expired batches">' + alert + '</span>' : '') + '</button>').join('');
    $('#tabs').innerHTML = navHtml;
    const end = $('#tabsEnd'); if (end) end.innerHTML = navHtml;
  }
  function renderView() {
    renderHeader();
    const v = $('#view');
    if (tab === 'today') v.innerHTML = viewToday();
    else if (tab === 'scan') { v.innerHTML = viewScan(); renderCapture(); renderCard(); renderRound(); }
    else if (tab === 'expiry') { v.innerHTML = viewExpiry(); renderRecall(); }
    else if (tab === 'report') v.innerHTML = viewReport();
    else v.innerHTML = viewSettings();
    if (ui.fileFallback) showFallback();
  }
  function rerender() { renderNav(); renderView(); }

  /* ================= Today ================= */

  function viewToday() {
    const lines = state.round.lines;
    if (!state.products.length && !lines.length) {
      return '<section class="panel welcome"><span class="eyebrow">Store-level checks on your own phone</span><h2>Photograph a pack to start</h2>' +
        '<ol class="steps"><li><b>Set your name</b> under Settings, so reports show who checked what.</li>' +
        '<li><b>Photograph each pack</b> with the small square code in frame. Batch and expiry come straight from that code.</li>' +
        '<li><b>Open Expiry</b> for anything expired or short-dated, and mark it as pulled once it is off the shelf.</li></ol>' +
        '<p class="muted small">Nothing from your dispensing or POS system is used. Products are learned from the barcodes on the packs, and everything stays on this phone.</p>' +
        '<div class="btns"><button class="btn primary" data-act="openCamera">' + ICON.camera + 'Take the first photo</button><button class="btn" data-act="demoPhoto">Try a sample photo</button></div></section>';
    }
    const t = today();
    const todays = lines.filter((l) => SC.todayIso(l.at) === t);
    const packsToday = todays.reduce((s, l) => s + l.qty, 0);
    const ec = expiryCounts();
    const plan = SC.planChecks(state.products, { now: t, batches: batchGroups(), checkedToday: todays.map((l) => l.productId), settings: state.settings, limit: 8 });
    let html = '<div class="stats">' +
      '<div class="stat"><span class="v num">' + packsToday + '</span><span class="l">Packs checked today</span></div>' +
      '<button class="stat linkstat" data-act="tab" data-tab="expiry"><span class="v num ' + (ec.expired ? 'bad' : 'good') + '">' + ec.expired + '</span><span class="l">Expired batches on the shelf</span></button>' +
      '<button class="stat linkstat" data-act="tab" data-tab="expiry"><span class="v num ' + (ec.soon ? 'warn' : 'good') + '">' + ec.soon + '</span><span class="l">Short-dated (≤' + state.settings.soonDays + ' days)</span></button></div>';
    html += '<section class="panel" id="checkNext" aria-label="Check next"><div class="panel-head"><div><h2>Check next</h2><p class="muted small">Expired stock still on the shelf first, then short-dated batches, high-risk lines and anything not checked for a while.</p></div>' +
      '<button class="btn small primary" data-act="openCamera">' + ICON.camera + 'Photo</button></div>';
    if (!plan.length) html += '<div class="empty"><strong>Nothing urgent.</strong><span>Every product you have seen is fine or was checked today. Photograph anything else you want to add.</span></div>';
    else html += '<div class="list">' + plan.map((x, i) => '<div class="item"><div style="display:flex;gap:10px;min-width:0"><span class="rank num">' + (i + 1) + '</span><div style="min-width:0;display:grid;gap:4px"><div class="name">' + esc(x.product.name) + '</div>' +
      '<div class="chips">' + x.reasons.map((r) => '<span class="chip ' + r.tone + '">' + esc(r.text) + '</span>').join('') + '</div></div></div>' +
      '<div class="side"><button class="btn small" data-act="checkProduct" data-id="' + esc(x.product.id) + '">Check</button></div></div>').join('') + '</div>';
    html += '</section>';
    const unnamed = state.products.filter((p) => isUnnamed(p) && lines.some((l) => l.productId === p.id));
    if (unnamed.length) html += '<div class="banner"><div><b>' + plural(unnamed.length, 'product') + ' still need' + (unnamed.length === 1 ? 's' : '') + ' a name.</b> Tap one below to name it, so Expiry and recalls read clearly.</div></div>';
    const recent = lines.slice().sort((a, b) => isUnnamed(prod(b.productId)) - isUnnamed(prod(a.productId))).slice(0, 4);
    if (recent.length) html += '<section class="panel"><div class="panel-head"><h3>Latest packs</h3><button class="link small" data-act="tab" data-tab="scan">All ' + lines.length + '</button></div><div class="list">' + recent.map(lineRow).join('') + '</div></section>';
    return html;
  }
  function lineRow(l) {
    const p = prod(l.productId);
    const es = SC.expiryStatus(l.expiry, null, state.settings.soonDays);
    return '<div class="item"><div style="min-width:0;display:grid;gap:2px"><button class="link rowlink" data-act="editLine" data-id="' + esc(l.id) + '"><span class="name">' + esc(p ? p.name : 'Unknown') + '</span></button>' +
      '<div class="meta"><span class="mono">' + esc(l.batch || 'no batch') + '</span><span>' + (l.expiry ? 'Exp ' + fmtExp(l.expiry) : 'No expiry') + '</span><span>' + fmtTime(l.at) + '</span></div></div>' +
      '<div class="side"><b class="num">× ' + l.qty + '</b>' + (es.tone === 'bad' || es.tone === 'warn' ? '<span class="chip ' + es.tone + '">' + esc(es.label) + '</span>' : '') + '</div></div>';
  }

  /* ================= Scan ================= */

  function viewScan() {
    const s = state.settings;
    return '<div class="grid2"><div class="view" style="gap:16px"><section class="panel"><div class="panel-head"><h2>Capture</h2>' +
      '<div class="seg" role="group" aria-label="Capture method">' + [['photo', 'Photo'], ['scanner', 'Scanner'], ['search', 'Search']].map(([k, l]) => '<button type="button" data-act="method" data-m="' + k + '" aria-pressed="' + (ui.method === k) + '">' + l + '</button>').join('') + '</div></div>' +
      '<div id="captureBody" class="capture"></div>' +
      '<div style="display:flex;gap:10px;align-items:end;flex-wrap:wrap;justify-content:space-between">' +
      '<div class="seg" role="group" aria-label="Scan mode"><button type="button" data-act="mode" data-m="each" aria-pressed="' + (s.scanMode === 'each') + '">Each scan = 1 pack</button><button type="button" data-act="mode" data-m="qty" aria-pressed="' + (s.scanMode === 'qty') + '">Enter quantity</button></div>' +
      '<label class="f" style="flex:1;min-width:140px">Location<input type="text" id="locInput" value="' + esc(s.lastLocation) + '" placeholder="e.g. Bay 4, Fridge" autocomplete="off"></label></div></section>' +
      '<div id="card"></div></div><section class="panel" id="roundPanel"></section></div>';
  }
  function renderCapture() {
    const el = $('#captureBody'); if (!el) return;
    if (ui.method === 'photo') {
      let h = '<label class="shot" for="photoInput">' + ICON.camera + '<strong>Photograph the pack</strong><span class="muted small">Fill about a hand’s width with the small square code. Tap the screen on the code to focus first.</span>' +
        '<input id="photoInput" type="file" accept="image/*" capture="environment"></label>' +
        '<label class="link small" for="galleryInput" style="justify-self:start">Or choose a photo you already took<input id="galleryInput" type="file" accept="image/*" class="sr"></label>';
      if (ui.photo) h += '<div class="preview"><canvas id="photoCanvas"></canvas><div class="status" id="photoStatus">' + photoStatusHtml() + '</div></div>';
      const tools = [];
      if (ui.photo && !ui.photo.busy && ui.photo.failed) {
        if (canAskClaude()) tools.push('<button class="btn small" data-act="aiRead" data-mode="rescue">' + ICON.spark + 'Read the printed text with Claude</button>');
        tools.push('<button class="btn small" data-act="method" data-m="search">Enter by hand</button>');
      }
      if (!state.products.length) tools.push('<button class="btn small" data-act="demoPhoto">Try a sample photo</button>');
      if (tools.length) h += '<div class="btns">' + tools.join('') + '</div>';
      el.innerHTML = h;
      if (ui.photo) drawPhoto();
    } else if (ui.method === 'scanner') {
      el.innerHTML = '<form class="scanbox" id="scanForm" autocomplete="off"><input type="text" id="scanInput" placeholder="Scan or paste a barcode" aria-label="Barcode" spellcheck="false" autocapitalize="off"><button class="btn primary" type="submit">Add</button></form>' +
        '<p class="muted small">For a Bluetooth or USB scanner in keyboard mode: pull the trigger and the code lands here. You can also paste a GS1 string like (01)…(17)…(10)…</p>';
    } else {
      el.innerHTML = '<label class="f">Find a product you have checked before<input type="search" id="searchInput" value="' + esc(ui.searchQuery) + '" placeholder="Name or barcode" autocomplete="off"></label><div id="searchResults" class="list"></div>';
      renderSearchResults();
    }
  }
  function photoStatusHtml() {
    const p = ui.photo; if (!p) return '';
    return (p.busy ? '<span class="spin" aria-hidden="true"></span>' : '') + '<span>' + esc(p.status || '') + '</span>';
  }
  function drawPhoto() {
    const c = $('#photoCanvas'); if (!c || !ui.photo) return;
    const src = ui.photo.canvas;
    c.width = src.width; c.height = src.height;
    const ctx = c.getContext('2d'); ctx.drawImage(src, 0, 0);
    if (ui.photo.region) {
      const r = ui.photo.region;
      ctx.lineWidth = Math.max(3, src.width / 250);
      ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent') || '#0a6b60';
      ctx.strokeRect(r.x, r.y, r.w, r.h);
    }
  }
  function renderSearchResults() {
    const el = $('#searchResults'); if (!el) return;
    const q = ui.searchQuery.trim();
    if (!q) { el.innerHTML = state.products.length ? '<p class="muted small">Type a few letters, e.g. “ator 40”.</p>' : '<p class="muted small">No products yet. Photograph a pack, or type a name to add one by hand.</p>'; return; }
    const res = SC.searchProducts(state.products.map((p) => Object.assign({ pde: '' }, p)), q, 8);
    let h = res.map((p) => '<div class="item"><div class="name" style="min-width:0">' + esc(p.name) + '</div><div class="side"><button class="btn small" data-act="pickProduct" data-id="' + esc(p.id) + '">Select</button></div></div>').join('');
    if (q.length >= 3 && !res.some((p) => p.name.toLowerCase() === q.toLowerCase())) h += '<div class="item"><div class="muted small" style="min-width:0">Not in the list?</div><div class="side"><button class="btn small" data-act="addByName">Add “' + esc(q) + '”</button></div></div>';
    el.innerHTML = h;
  }

  function renderCard() {
    const el = $('#card'); if (!el) return;
    const cur = ui.current;
    if (!cur) { el.innerHTML = '<section class="label"><div class="lhead"><span class="eyebrow">Last pack</span><p class="muted">The product, batch, expiry and serial appear here to check before they are saved.</p></div></section>'; return; }
    const p = cur.productId ? prod(cur.productId) : null;
    const line = cur.lineId ? state.round.lines.find((l) => l.id === cur.lineId) : null;
    const hr = p && SC.isHighRisk(p, state.settings);
    const badRead = !!(cur.gtin && !SC.isValidGtin(cur.gtin));

  /* --- drafting and saving a pack --- */

  function startDraft(fields, source) {
    const pid = (fields.gtin && (byGtin[fields.gtin] || ensureProductFromGtin(fields.gtin))) || fields.productId || null;
    const dup = fields.serial && fields.gtin ? state.round.lines.find((l) => l.gtin === fields.gtin && l.serial === fields.serial) : null;
    ui.current = {
      productId: pid, gtin: fields.gtin || (pid && prod(pid).gtin) || '', batch: fields.batch || '', expiry: fields.expiry || '', serial: fields.serial || '',
      qty: fields.qty || 1, source, warnings: fields.warnings || [], duplicate: dup || null, lineId: null, aiFilled: false,
    };
    const clean = pid && !dup && !(fields.warnings || []).length && source !== 'manual' && source !== 'ai';
    if (state.settings.scanMode === 'each' && clean) commit(true);
    else renderCard();
    if (dup) beep(false);
    save();
  }
  function handleRaw(raw, source) {
    const r = SC.parseGs1(raw);
    if (!r.fields.gtin) {
      toast(r.warnings[0] ? 'Could not read that code: ' + r.warnings[0] : 'Could not read that code');
      beep(false);
      return false;
    }
    startDraft(Object.assign({}, r.fields, { warnings: r.warnings.filter((w) => !/No GTIN|check digit/.test(w)) }), source);
    return r;
  }
  function readCardFields() {
    const cur = ui.current; if (!cur) return;
    const b = $('#fBatch'), e = $('#fExpiry'), q = $('#fQty');
    if (b) cur.batch = b.value.trim();
    if (e) { const v = e.value.trim(); cur.expiry = v ? SC.parseLooseExpiry(v) || cur.expiry : ''; }
    if (q) cur.qty = Math.max(0, Math.round(Number(q.value) || 0));
  }
  function needsEvidence(l) {
    if (l.source !== 'photo' && l.source !== 'ai') return false;

    return !l.expiry || es.tone === 'bad' || es.tone === 'warn' || l.source === 'ai';
  }
  function commit(fast) {
    const cur = ui.current; if (!cur || !cur.productId || cur.duplicate) return;
    if (cur.gtin && !SC.isValidGtin(cur.gtin)) return;
    if (!fast) readCardFields();
    const loc = $('#locInput'); if (loc) state.settings.lastLocation = loc.value.trim();
    const p = prod(cur.productId);
    const l = { id: uid(), productId: cur.productId, gtin: cur.gtin || p.gtin || '', batch: cur.batch, expiry: cur.expiry, serial: cur.serial, qty: cur.qty, location: state.settings.lastLocation || '', at: new Date().toISOString(), source: cur.source, who: state.settings.who || '' };
    if (needsEvidence(l) && ui.photo && ui.photo.canvas) l.thumb = addThumb(ui.photo.canvas);
    state.round.lines.push(l);
    p.lastChecked = today();
    cur.lineId = l.id;
    save(); beep(true);
    renderNav(); renderCard(); renderRound(); refocusScanner();
    toast('Saved ' + l.qty + ' × ' + (isUnnamed(p) ? 'unnamed product' : p.name), () => removeLine(l.id));
  }
  function refocusScanner() {
    if (ui.method !== 'scanner') return;
    const i = $('#scanInput'), a = document.activeElement;
    if (i && (!a || a === document.body || a.tagName === 'BUTTON')) i.focus({ preventScroll: true });
  }
  function updateLineFromCard() {

    readCardFields();
    const l = state.round.lines.find((x) => x.id === cur.lineId); if (!l) return;
    l.batch = cur.batch; l.expiry = cur.expiry; l.qty = cur.qty;

  /* --- photo pipeline --- */

  let zxingP = null;
  function loadZXing() {
    if (window.ZXing) return Promise.resolve(window.ZXing);
    if (!zxingP) zxingP = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = ZXING_URL; s.async = true; s.crossOrigin = 'anonymous';
      s.onload = () => (window.ZXing ? res(window.ZXing) : rej(new Error('The barcode reader did not start.')));
      s.onerror = () => { zxingP = null; rej(new Error('Could not load the barcode reader. Check the connection and try again.')); };
      document.head.appendChild(s);
    });
    return zxingP;
  }
  function preloadZXing() { if (!window.BarcodeDetector) loadZXing().catch(() => {}); }
  async function fileToCanvas(file, max) {
    let src;
    try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
    catch (e) { src = await new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = () => rej(new Error('That file could not be opened as an image. Try a JPEG or PNG.')); img.src = URL.createObjectURL(file); }); }
    const f = Math.min(1, (max || 1600) / Math.max(src.width, src.height));
    const c = document.createElement('canvas');
    c.width = Math.round(src.width * f); c.height = Math.round(src.height * f);
    c.getContext('2d', { willReadFrequently: true }).drawImage(src, 0, 0, c.width, c.height);
    return c;
  }
  function cropCanvas(src, r, scale) {
    const c = document.createElement('canvas');
    c.width = Math.round(r.w * scale); c.height = Math.round(r.h * scale);
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(src, r.x, r.y, r.w, r.h, 0, 0, c.width, c.height);
    return c;
  }
  function canvasGray(canvas) {
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    return SCD.rgbaToGray(ctx.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height);
  }
  async function nativeDetect(canvas) {
    if (!('BarcodeDetector' in window)) return [];
    try {
      const supported = await window.BarcodeDetector.getSupportedFormats();
      const want = ['data_matrix', 'qr_code', 'ean_13', 'ean_8', 'upc_a', 'code_128', 'itf'].filter((f) => supported.includes(f));
      if (!want.length) return [];
      const found = await new window.BarcodeDetector({ formats: want }).detect(canvas);
      found.sort((a, b) => (b.format === 'data_matrix') - (a.format === 'data_matrix'));
      return found.map((f) => ({ text: f.rawValue, format: f.format, codePx: f.boundingBox ? Math.round(Math.max(f.boundingBox.width, f.boundingBox.height)) : null }));
    } catch (e) { return []; }
  }
  async function decodeCanvas(canvas) {
    const res = await nativeDetect(canvas);
    if (res.length && res.some((r) => SC.parseGs1(r.text).fields.gtin)) return res;
    const Z = await loadZXing();
    return SCD.decodeGrayAsync(Z, canvasGray(canvas), canvas.width, canvas.height, (n) => setPhotoStatus('Reading code… pass ' + n, true));
  }
  function setPhotoStatus(text, busy) {
    if (!ui.photo) return;
    ui.photo.status = text; ui.photo.busy = !!busy;
    const s = $('#photoStatus'); if (s) s.innerHTML = photoStatusHtml();
  }
  function qualityHint(q) {
    if (!q) return '';
    if (q.sharpness < 2) return ' Nothing in the photo has any detail. Check the pack is in frame.';
    if (q.sharpness < 60) return ' The photo looks blurry: hold still and tap the screen on the code to focus.';
    if (q.brightness < 70) return ' The photo looks dark: add light or use the torch.';
    if (q.glare > 4) return ' There is glare on the pack: tilt it slightly away from the light.';
    return '';
  }
  async function processPhoto(canvas, label) {
    let q = null;
    try { q = SCD.imageQuality(canvasGray(canvas), canvas.width, canvas.height); } catch (e) { q = null; }
    ui.photo = { canvas, busy: true, status: 'Reading code…', failed: false, region: null, attempt: null };
    renderCapture();
    const minSide = Math.min(canvas.width, canvas.height);
    try {
      const t0 = performance.now();
      const res = await decodeCanvas(canvas);
      const ms = Math.round(performance.now() - t0);
      ui.photo.busy = false;
      const r = res.length ? handleRaw(res[0].text, label || 'photo') : false;
      ui.photo.attempt = logAttempt({ method: 'photo', outcome: r ? 'read' : 'fail', ms, kind: kindOf(r), hasBatch: !!(r && r.fields.batch), hasExpiry: !!(r && r.fields.expiry), codeFrac: r && res[0].codePx ? r3(res[0].codePx / minSide) : null, sharpness: q && q.sharpness, brightness: q && q.brightness, glare: q && q.glare, w: canvas.width, h: canvas.height });
      if (r) { ui.photo.failed = false; ui.photo.status = 'Read ' + res[0].format.replace('_', ' ').toLowerCase() + ' in ' + (ms / 1000).toFixed(1) + 's'; }
      else { ui.photo.failed = true; ui.photo.status = 'No code found. Tap the code in the photo to zoom in on it.' + qualityHint(q); }
    } catch (e) { ui.photo.failed = true; ui.photo.busy = false; ui.photo.status = e.message || 'Something went wrong reading the photo.'; }

  }
  function rescueAttempt(outcome, r, extra) {
    const a = ui.photo && ui.photo.attempt;

    Object.assign(a, { outcome, kind: outcome === 'ai' ? 'none' : kindOf(r), hasBatch: !!(r && r.fields && r.fields.batch), hasExpiry: !!(r && r.fields && r.fields.expiry) }, extra || {});
    save();
  }
  async function zoomDecode(evt) {
    if (!ui.photo || ui.photo.busy) return;
    const c = $('#photoCanvas'); const rect = c.getBoundingClientRect();
    const src = ui.photo.canvas;
    const scale = Math.min(rect.width / src.width, rect.height / src.height);
    const ox = (rect.width - src.width * scale) / 2, oy = (rect.height - src.height * scale) / 2;
    const x = (evt.clientX - rect.left - ox) / scale, y = (evt.clientY - rect.top - oy) / scale;

    const r = { x: Math.max(0, Math.min(src.width - size, Math.round(x - size / 2))), y: Math.max(0, Math.min(src.height - size, Math.round(y - size / 2))), w: size, h: size };

      const res = await decodeCanvas(cropCanvas(src, r, zs));
      ui.photo.busy = false;
      const parsed = res.length ? handleRaw(res[0].text, 'photo') : false;
      if (parsed) { ui.photo.failed = false; setPhotoStatus('Read from the zoomed area', false); rescueAttempt('zoom', parsed, { codeFrac: res[0].codePx ? r3(res[0].codePx / zs / Math.min(src.width, src.height)) : null }); }
      else setPhotoStatus('Still no code there. Retake it closer, or use Enter by hand.', false);

  }

  // mode 'rescue': no code was found. mode 'fill': a code was read but the name, batch or expiry is missing.
  async function aiRead(mode) {
    if (!ui.photo || !canAskClaude()) return;
    setPhotoStatus('Asking Claude to read the printed text…', true);
    if (mode === 'fill') renderCard();
    try {
      const blob = await new Promise((res) => ui.photo.canvas.toBlob(res, 'image/jpeg', 0.85));
      const prompt = 'This photo shows an Australian medicine or pharmacy product pack. Read only what is printed. Reply with only a JSON object: ' +
        '{"product": string|null (brand or generic name with strength and pack size as printed, e.g. "Atorvastatin 40mg tablets 30"), "batch": string|null (the value after BATCH, LOT, Lot No. or B/N), ' +
        '"expiry": string|null (the expiry exactly as printed, e.g. "05/2028" or "MAY 2028"), "barcode_digits": string|null (digits printed under a linear barcode, if fully legible), ' +
        '"count_estimate": integer|null (how many separate packs of this same product are visible in the photo; null if unclear)}. ' +
        'Use null for anything not clearly legible. Do not guess or infer.';
      const out = (await caps.sample.json(prompt, { images: [blob], cache: false })) || {};
      const name = out.product ? String(out.product).trim().slice(0, 80) : '';
      const batch = out.batch ? String(out.batch).trim().slice(0, 20) : '';
      const expiry = out.expiry ? SC.parseLooseExpiry(out.expiry) || '' : '';
      const seen = Number.isInteger(+out.count_estimate) && +out.count_estimate > 1 && +out.count_estimate <= 200 ? +out.count_estimate : 0;
      if (mode === 'fill' && ui.current && ui.current.productId) {
        const cur = ui.current, p = prod(cur.productId);
        if (isUnnamed(p) && name) p.name = name;
        if (!cur.batch && batch) cur.batch = batch;
        if (!cur.expiry && expiry) cur.expiry = expiry;
        if (seen && cur.qty === 1 && !cur.lineId) { cur.qty = seen; cur.warnings = (cur.warnings || []).concat('Claude counted ' + seen + ' packs in the photo. Confirm the quantity on the shelf.'); }
        cur.aiFilled = true;
        if (cur.lineId) { const l = state.round.lines.find((x) => x.id === cur.lineId); if (l) { l.batch = cur.batch; l.expiry = cur.expiry; if (!l.thumb) l.thumb = addThumb(ui.photo.canvas); } }
        save();
        setPhotoStatus(name || batch || expiry ? 'Claude filled what it could read' : 'Claude could not read any more from this photo', false);
        renderCard(); renderRound(); renderNav();
      } else {
        const fields = { warnings: ['Read from the printed text, not a barcode. Check the batch and expiry against the pack.'], batch, expiry };
        if (seen) { fields.qty = seen; fields.warnings.push('Claude counted ' + seen + ' packs in the photo. Confirm the quantity on the shelf.'); }
        const digits = String(out.barcode_digits || '').replace(/\D/g, '');
        if (digits && SC.isValidGtin(digits)) fields.gtin = SC.gtinKey(digits);
        if (!fields.gtin && name) fields.productId = ensureProductByName(name);
        if (fields.gtin && name) { const p = prod(ensureProductFromGtin(fields.gtin)); if (p && isUnnamed(p)) p.name = name; }
        rescueAttempt('ai', { fields });
        setPhotoStatus(name || batch || expiry ? 'Claude read the printed text' : 'Claude could not read a name, batch or expiry', false);
        if (fields.gtin || fields.productId) startDraft(fields, 'ai'); else toast('Nothing usable was readable. Enter it by hand.');
      }
    } catch (e) {
      const msg = e && e.code === 'not_granted' ? 'Claude was not allowed to read photos on this page.' : e && e.code === 'rate_limited' ? 'Too many requests. Wait a moment and try again.' : (e && e.message) || 'Claude could not read the photo.';
      setPhotoStatus(msg, false);
    }
    renderCapture();
  }
  async function demoPhoto() {

    await processPhoto(c, 'photo');

  }

  /* ================= Expiry ================= */

  function viewExpiry() {
    const groups = batchGroups();
    const b = SC.expiryBuckets(groups.filter((g) => !g.removed), today(), state.settings.soonDays);
    const pulled = groups.filter((g) => g.removedQty > 0);
    let html = '<section class="panel"><div class="panel-head"><h2>Recall lookup</h2></div><label class="f">Batch number from the recall notice<input type="search" id="recallInput" value="' + esc(ui.recall) + '" placeholder="e.g. MJ5R27A" class="mono" autocomplete="off" spellcheck="false"></label><div id="recallResults"></div></section>';
    const group = (title, list, tone, note, pullable) => {
      let h = '<section class="panel"><div class="panel-head"><h3>' + title + ' <span class="muted num">' + list.length + '</span></h3>' + (note ? '<span class="muted small">' + note + '</span>' : '') + '</div>';
      if (!list.length) return h + '<p class="muted small">None found in checked stock.</p></section>';

  function batchItem(x, tone, pullable, pulledView) {

  /* ================= Report ================= */

  /* ================= DD register check ================= */
  // Drugs-of-dependence balance check: register balance vs physical count, per product.
  function ddProducts() {
    const ids = new Set(Object.keys(state.dd.rows));

      .sort((a, b) => a.name.localeCompare(b.name));

  function ddScanned(pid) {

  function ddDiff(r) {
    if (!r || r.reg === '' || r.reg == null || r.count === '' || r.count == null) return null;
